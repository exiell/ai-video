<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta
      name="description"
      content="AniGuide · AI 动漫视频创作向导，把「我想做个动漫视频」变成一份可直接开拍的制作方案：分镜表、角色与场景设定卡、多平台提示词、穿帮检查单。"
    />
    <script>
      // 在 React 挂载前同步外观与运行环境，彻底消除冷启动白屏闪烁
      try {
        var theme = localStorage.getItem('aniguide.theme');
        if (
          theme === 'prism' ||
          theme === 'pop' ||
          theme === 'night' ||
          theme === 'blueprint' ||
          theme === 'studio'
        ) {
          document.documentElement.dataset.theme = theme;
        } else {
          document.documentElement.dataset.theme = 'prism';
        }
        if (window.aniguideDesktop && window.aniguideDesktop.isDesktop) {
          document.documentElement.dataset.runtime = 'desktop';
          document.documentElement.dataset.platform = window.aniguideDesktop.platform;
        }
      } catch (e) {}
    </script>
    <title>AniGuide · AI 动漫视频创作向导</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>本工具需要 JavaScript 才能运行。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
